[package]
name = "infers-backend-executorch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[features]
default = ["portable", "xnnpack", "vulkan"]
portable = []
xnnpack = []
vulkan = ["dep:infers-gpu", "dep:processing", "processing/vulkan"]

[dependencies]
infers-core = { path = "../../core" }
infers-gpu = { path = "../../gpu", optional = true }
processing = { path = "../../processing", optional = true }
parking_lot.workspace = true
thiserror.workspace = true
tempfile = "3"
executorch = { version = "0.12.0", features = ["std", "module", "data-loader", "ndarray", "half", "tensor-ptr"] }

[dev-dependencies]
processing = { path = "../../processing" }

[lints]
workspace = true
