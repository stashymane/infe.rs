[package]
name = "processing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[features]
default = ["vulkan"]
vulkan = ["dep:infers-gpu", "dep:ash", "dep:spirv-builder"]

[dependencies]
processing-core = { path = "core" }
infers-core = { path = "../core" }
infers-gpu = { path = "../gpu", optional = true }
ash = { workspace = true, optional = true }
parking_lot.workspace = true
thiserror.workspace = true

[build-dependencies]
spirv-builder = { version = "=0.10.0-alpha.1", optional = true }

[dev-dependencies]
trybuild = "1.0"

[lints]
workspace = true
