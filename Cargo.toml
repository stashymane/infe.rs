[workspace]
members = [
    "crates/backends/executorch",
    "crates/bindings",
    "crates/core",
    "crates/gpu",
    "crates/platform/android",
    "crates/processing",
    "crates/processing/core",
    "crates/test-utils",
]
exclude = [
    "crates/processing/shaders",
]
resolver = "3"

[workspace.package]
# project version is set by CI, 0.0.0 is used for local builds
version = "0.0.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/stashymane/infers"
homepage = "https://github.com/stashymane/infers"
description = "ML pipeline assembly kit"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[workspace.dependencies]
ash = "0.38"
clap = { version = "4", features = ["derive"] }
# Used instead of `std::sync::Mutex` so that a panic while a lock is held cannot
# poison it and turn every later access into an error or panic.
parking_lot = "0.12"
thiserror = "2"

[package]
name = "infers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[dependencies]
infers-core = { path = "crates/core" }
infers-gpu = { path = "crates/gpu", optional = true }
processing = { path = "crates/processing" }
infers-backend-executorch = { path = "crates/backends/executorch", default-features = false }
clap = { workspace = true }

[features]
default = ["portable", "xnnpack", "vulkan"]
portable = ["infers-backend-executorch/portable"]
xnnpack = ["infers-backend-executorch/xnnpack"]
vulkan = ["infers-backend-executorch/vulkan", "processing/vulkan", "dep:infers-gpu"]

[dev-dependencies]
infers-test-utils = { path = "crates/test-utils", features = ["vulkan"] }

[target.'cfg(target_os = "android")'.dependencies]
platform-android = { path = "crates/platform/android" }

[lints]
workspace = true
