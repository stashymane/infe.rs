[workspace]
members = [
    "crates/infers",
    "crates/infers-backend-executorch",
    "crates/infers-bindings",
    "crates/infers-core",
    "crates/infers-gpu",
    "crates/infers-platform-android",
    "crates/infers-processing",
    "crates/infers-processing-core",
    "crates/infers-test-utils",
]
exclude = [
    "crates/infers-processing-shaders",
]
default-members = ["crates/infers"]
resolver = "3"

[workspace.package]
# project version is set by CI, 0.0.0 is used for local builds
version = "0.0.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/stashymane/infers"
homepage = "https://github.com/stashymane/infers"
description = "ML pipeline assembly kit"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[workspace.dependencies]
ash = "0.38"
criterion = { version = "0.8.2", features = ["html_reports"] }
# Used instead of `std::sync::Mutex` so that a panic while a lock is held cannot
# poison it and turn every later access into an error or panic.
parking_lot = "0.12"
thiserror = "2"
