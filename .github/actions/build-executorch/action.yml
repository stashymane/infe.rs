name: Build ExecuTorch
description: Nix-build ExecuTorch static libs for one platform (x86_64-unknown-linux-gnu or android-arm64).

inputs:
  target:
    description: x86_64-unknown-linux-gnu or android-arm64
    required: true
  artifact-name:
    description: Name for the archive (excluding .tar.gz)
    required: false
    default: ""

outputs:
  artifact:
    description: Artifact / tarball basename
    value: ${{ inputs.artifact-name || format('executorch-{0}', inputs.target) }}

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Cache Nix store
      uses: nix-community/cache-nix-action@v6
      with:
        primary-key: et-nix-${{ inputs.target }}-${{ hashFiles('flake.lock', 'nix/**') }}
        restore-prefixes-first-match: et-nix-${{ inputs.target }}-
        restore-prefixes-all-matches: et-nix-${{ inputs.target }}-
        gc-max-store-size-linux: ${{ inputs.target == 'android-arm64' && '4G' || '2G' }}
        purge: true
        purge-prefixes: et-nix-${{ inputs.target }}-
        purge-created: 604800
        purge-last-accessed: 1209600
        purge-primary-key: never

    - name: Build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: bash "${{ github.action_path }}/build.sh" "${TARGET}"
