name: Setup Android host toolchains
description: Installs the Android SDK and NDK.

inputs:
  ndk-version:
    description: Android NDK version
    required: false
    default: "29.0.14206865"
  compile-sdk:
    description: Android platform API level
    required: false
    default: "36"
  build-tools:
    description: Android build-tools version
    required: false
    default: "36.0.0"

runs:
  using: composite
  steps:
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: tools platform-tools platforms;android-${{ inputs.compile-sdk }} build-tools;${{ inputs.build-tools }} ndk;${{ inputs.ndk-version }}

    - name: Export NDK home
      shell: bash
      run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${{ inputs.ndk-version }}" >> "${GITHUB_ENV}"

    - name: Write kotlin/local.properties
      shell: bash
      run: printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > kotlin/local.properties
