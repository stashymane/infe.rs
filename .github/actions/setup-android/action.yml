name: Setup Android host toolchains
description: >
  Install JDK 17, Android SDK (platform 36 / build-tools / NDK), and write
  kotlin/local.properties. Rust aarch64-linux-android is expected from the
  rust-toolchain step.

inputs:
  ndk-version:
    description: Android NDK version (sdkmanager package id)
    required: false
    default: "29.0.14206865"
  compile-sdk:
    description: Android platform API level
    required: false
    default: "36"
  build-tools:
    description: Android build-tools version
    required: false
    default: "36.0.0"

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK packages
      shell: bash
      run: |
        set -euo pipefail
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager --install \
          "platform-tools" \
          "platforms;android-${{ inputs.compile-sdk }}" \
          "build-tools;${{ inputs.build-tools }}" \
          "ndk;${{ inputs.ndk-version }}"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${{ inputs.ndk-version }}" >> "${GITHUB_ENV}"

    - name: Write kotlin/local.properties
      shell: bash
      run: printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > kotlin/local.properties
