name: Build ExecuTorch

on:
  workflow_call:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-executorch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ExecuTorch (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-unknown-linux-gnu, android-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: build
        uses: ./.github/actions/build-executorch
        with:
          target: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: target/executorch
          if-no-files-found: error
          retention-days: 7
