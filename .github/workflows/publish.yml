name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-kotlin:
    name: Publish Kotlin modules
    uses: ./.github/workflows/x-build.yml
    with:
      publish: true
      version: ${{ inputs.version || '' }}
    permissions:
      contents: read
      packages: write
      actions: write
    secrets: inherit
