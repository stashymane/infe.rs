name: Publish Kotlin modules

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/x-build.yml
    with:
      publish: true
      version: ${{ inputs.version || '' }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
