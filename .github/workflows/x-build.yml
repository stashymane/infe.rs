name: Build project

on:
  workflow_call:
    inputs:
      publish:
        description: Publish Kotlin artifacts to GitHub Packages
        type: boolean
        required: false
        default: false
      release:
        description: Build release artifacts (optimized Cargo profile and release Gradle variants)
        type: boolean
        required: false
        default: false

jobs:
  executorch:
    name: ExecuTorch (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-unknown-linux-gnu, android-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: build
        uses: ./.github/actions/build-executorch
        with:
          target: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: target/executorch
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build library
    needs: executorch
    runs-on: ubuntu-latest
    env:
      EXECUTORCH_RS_EXECUTORCH_LIB_DIR: ${{ github.workspace }}/target/executorch/x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7

      - id: version
        uses: ./.github/actions/resolve-version
        with:
          publish: ${{ inputs.publish }}
          release: ${{ inputs.release }}

      - name: Build library
        uses: ./.github/actions/build-library
        env:
          INFERS_VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ steps.version.outputs.version }}
        with:
          publish: ${{ inputs.publish }}
          release: ${{ inputs.release }}
