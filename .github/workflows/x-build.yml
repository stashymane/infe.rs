name: Build project

on:
  workflow_call:
    inputs:
      publish:
        description: Publish Kotlin artifacts to GitHub Packages
        type: boolean
        required: false
        default: false
      version:
        description: Version override (empty = tag or 0.0.0-dev.<sha>)
        type: string
        required: false
        default: ""

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.publish || false }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  executorch:
    name: Build ExecuTorch
    uses: ./.github/workflows/x-build-executorch.yml
    permissions:
      contents: read
      actions: write

  build:
    name: Build library
    needs: executorch
    runs-on: ubuntu-latest
    env:
      EXECUTORCH_RS_EXECUTORCH_LIB_DIR: ${{ github.workspace }}/target/executorch/x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            version="0.0.0-dev.${GITHUB_SHA:0:7}"
          else
            version="0.0.0-dev"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "INFERS_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${version}" >> "${GITHUB_ENV}"

      - name: Download ExecuTorch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: executorch-*
          merge-multiple: true
          path: target/executorch

      - name: Verify ExecuTorch layout
        run: |
          test -f target/executorch/x86_64-unknown-linux-gnu/libexecutorch.a
          test -f target/executorch/x86_64-unknown-linux-gnu/backends/vulkan/libinfers_et_vulkan_ffi.a
          test -f target/executorch/android-arm64/libexecutorch.a
          test -f target/executorch/android-arm64/backends/vulkan/libinfers_et_vulkan_ffi.a
          find target/executorch -name '*.a' | head

      - name: Install host Vulkan libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Android host toolchains
        uses: ./.github/actions/setup-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android

      - name: Cargo build
        run: cargo build --workspace --all-features

      - name: Gradle assemble
        if: ${{ !inputs.publish }}
        working-directory: kotlin
        run: ./gradlew assemble --console=plain

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish }}
        working-directory: kotlin
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --console=plain
