name: Project builder

on:
  workflow_call:
    inputs:
      publish:
        description: Publish Kotlin artifacts to GitHub Packages
        type: boolean
        required: false
        default: false
      version:
        description: Version override (empty = tag or 0.0.0-dev.<sha>)
        type: string
        required: false
        default: ""

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.publish || false }}
  cancel-in-progress: ${{ !inputs.publish }}

permissions:
  contents: read

jobs:
  executorch:
    name: Build ExecuTorch
    uses: ./.github/workflows/x-build-executorch.yml
    permissions:
      contents: read
      actions: write

  build:
    name: Build library
    needs: executorch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            version="0.0.0-dev.${GITHUB_SHA:0:7}"
          else
            version="0.0.0-dev"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "INFERS_VERSION=${version}"

      - name: Download ExecuTorch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: executorch-*
          merge-multiple: true
          path: target/executorch

      - name: Verify ExecuTorch layout
        run: |
          test -f target/executorch/x86_64-unknown-linux-gnu/libexecutorch.a
          test -f target/executorch/x86_64-unknown-linux-gnu/backends/vulkan/libinfers_et_vulkan_ffi.a
          test -f target/executorch/android-arm64/libexecutorch.a
          test -f target/executorch/android-arm64/backends/vulkan/libinfers_et_vulkan_ffi.a
          find target/executorch -name '*.a' | head

      - name: Setup Android host toolchains
        uses: ./.github/actions/setup-android

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-11
          components: rust-src, rustc-dev, llvm-tools
          targets: aarch64-linux-android

      - name: Install host Vulkan libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('kotlin/**/*.gradle.kts', 'kotlin/gradle/libs.versions.toml', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cargo build
        env:
          EXECUTORCH_RS_EXECUTORCH_LIB_DIR: ${{ github.workspace }}/target/executorch/x86_64-unknown-linux-gnu
        run: cargo build --workspace --all-features

      - name: Gradle assemble
        if: ${{ !inputs.publish }}
        env:
          INFERS_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/android_gradle.sh assemble --console=plain

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFERS_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/android_gradle.sh publishAllPublicationsToGitHubPackagesRepository --console=plain
