org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
# Gobley 0.3.7 tasks are not configuration-cache compatible yet.
org.gradle.configuration-cache=false

kotlin.code.style=official

android.useAndroidX=true

# Comma-separated Cargo features for the single libinfers_bindings build.
# Feature modules (:infers-portable, :infers-xnnpack, :infers-vulkan) validate
# that their feature is listed here when they are on the classpath.
infers.cargo.features=portable,xnnpack,vulkan

GROUP=dev.stashy.infers
VERSION_NAME=0.1.0-SNAPSHOT

POM_DESCRIPTION=Kotlin Multiplatform bindings for the Infers on-device inference runtime
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/infers-dev/infers
POM_LICENSE_NAME=Apache-2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/infers-dev/infers
POM_SCM_CONNECTION=scm:git:git://github.com/infers-dev/infers.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/infers-dev/infers.git
POM_DEVELOPER_ID=infers
POM_DEVELOPER_NAME=Infers Contributors
