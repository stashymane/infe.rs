# Kotlin
kotlin.code.style=official
# Gradle
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
# Gobley 0.3.7 tasks are not configuration-cache compatible yet.
org.gradle.configuration-cache=false
android.useAndroidX=true
# Comma-separated Cargo features for the single libinfers_bindings build.
# Feature modules (:infers-portable, :infers-xnnpack, :infers-vulkan) validate
# that their feature is listed here when they are on the classpath.
infers.cargo.features=portable,xnnpack,vulkan
# Publishing
GROUP=dev.stashy.infers
VERSION_NAME=0.1.0-SNAPSHOT
POM_DESCRIPTION=ML pipeline assembly kit
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/stashymane/infers
POM_LICENSE_NAME=GPL-3.0-or-later
POM_LICENSE_URL=https://www.gnu.org/licenses/gpl-3.0-standalone.html
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/stashymane/infers
POM_SCM_CONNECTION=scm:git:git://github.com/stashymane/infers.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/stashymane/infers.git
POM_DEVELOPER_ID=stashymane
POM_DEVELOPER_NAME=stashymane
